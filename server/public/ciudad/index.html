<!-- ============== APP JS ============== -->
<script type="module">
// =====================================================================
// AUTH — read JWT from localStorage (set by sxxysecret login) or prompt
// =====================================================================
function getToken() {
  return localStorage.getItem('token') || localStorage.getItem('sx_token') || null;
}

// Decode JWT payload without verifying signature (just to read `exp`)
function decodeJwtPayload(token) {
  try {
    const part = token.split('.')[1];
    if (!part) return null;
    // base64url → base64
    const b64 = part.replace(/-/g, '+').replace(/_/g, '/');
    const json = atob(b64);
    return JSON.parse(json);
  } catch { return null; }
}

// True if token is missing, malformed, or expired
function tokenIsStale(token) {
  if (!token) return true;
  const p = decodeJwtPayload(token);
  if (!p || typeof p.exp !== 'number') return true;
  // exp is in seconds, Date.now() in ms; treat as stale if <30s remaining
  return (p.exp * 1000) < (Date.now() + 30000);
}

function clearSession() {
  try { localStorage.removeItem('token'); } catch {}
  try { localStorage.removeItem('sx_token'); } catch {}
}

const $ = (id) => document.getElementById(id);

const loginBg   = $('login-bg');
const loginErr  = $('login-error');
const loginStat = $('login-status');
const loginBtn  = $('login-btn');

function setStatus(msg, color = '#888') {
  loginStat.textContent = msg;
  loginStat.style.color = color;
}

async function ensureAuth() {
  let token = getToken();
  // First line of defense: discard stale/expired tokens locally so we ALWAYS show the login
  if (token && tokenIsStale(token)) {
    clearSession();
    token = null;
  }
  if (token) {
    setStatus('Token detectado — verificando...', '#00d4ff');
    try {
      const r = await fetch('/api/profile', { headers: { Authorization: 'Bearer ' + token } });
      if (r.ok) {
        const data = await r.json();
        const user = data.user || data;
        setStatus(`✓ Hola, ${user.name}. Entrando...`, '#00ff88');
        return { token, user };
      }
      // 401/403: token rejected by server — wipe it and fall through to login
      if (r.status === 401 || r.status === 403) {
        clearSession();
        token = null;
      }
    } catch {}
  }
  // Show login form (it's already visible by default in CSS; just focus the email)
  return new Promise((resolve, reject) => {
    setStatus('Ingresa tus credenciales de sxxysecret.com');
    setTimeout(() => $('login-email').focus(), 100);

    loginBtn.onclick = async () => {
      const email = $('login-email').value.trim();
      const password = $('login-password').value;
      if (!email || !password) {
        loginErr.textContent = 'Email y contraseña requeridos';
        return;
      }
      loginErr.textContent = '';
      setStatus('Autenticando...', '#00d4ff');
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json();
        if (!r.ok) {
          loginErr.textContent = data.message || data.error || 'Login inválido';
          setStatus('');
          return;
        }
        localStorage.setItem('token', data.token);
        setStatus(`✓ Hola, ${data.user.name}. Conectando...`, '#00ff88');
        resolve({ token: data.token, user: data.user });
      } catch (e) {
        loginErr.textContent = 'Error de red: ' + e.message;
        setStatus('');
      }
    };
  });
}

// =====================================================================
// WEBSOCKET — connect to /ciudad with JWT in query
// =====================================================================
class CiudadClient {
  constructor(token) {
    this.token = token;
    this.ws = null;
    this.self = null;
    this.peers = new Map(); // userId → { el, name, role, color, x,y,z,ry,anim }
    this.moveThrottle = 33; // ~30fps
    this.lastSend = 0;
  }

  connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = `${proto}//${location.host}/ciudad?token=${encodeURIComponent(this.token)}`;
    setConn(false);
    this.ws = new WebSocket(url);

    this.ws.onopen = () => setConn(true);
    this.ws.onclose = () => {
      setConn(false);
      // Auto-reconnect after 2s
      setTimeout(() => this.connect(), 2000);
    };
    this.ws.onerror = () => { /* will close */ };

    this.ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      this.handle(msg);
    };
  }

  handle(msg) {
    if (msg.type === 'welcome') {
      this.self = msg.self;
      this.applySelfName();
      // Add existing peers
      for (const p of msg.peers) this.addOrUpdatePeer(p);
      renderPeerList();
    } else if (msg.type === 'peer_joined') {
      this.addOrUpdatePeer(msg.peer);
      addChat({ system: `${msg.peer.name} entró al mundo`, color: msg.peer.color });
    } else if (msg.type === 'peer_left') {
      this.removePeer(msg.userId);
      addChat({ system: `alguien salió del mundo`, color: '#888' });
    } else if (msg.type === 'peer_moved') {
      this.addOrUpdatePeer(msg.peer);
    } else if (msg.type === 'chat') {
      addChat({ name: msg.name, text: msg.text, color: msg.color, role: msg.role });
    }
  }

  addOrUpdatePeer(p) {
    let entry = this.peers.get(p.userId);
    if (!entry) {
      // Create new avatar entity
      const el = document.createElement('a-entity');
      el.setAttribute('position', `${p.x} ${p.y} ${p.z}`);
      el.setAttribute('rotation', `0 ${p.ry} 0`);

      const body = document.createElement('a-box');
      body.setAttribute('width', '0.6');
      body.setAttribute('height', '1.6');
      body.setAttribute('depth', '0.4');
      body.setAttribute('color', p.color);
      body.setAttribute('position', '0 0.8 0');
      body.setAttribute('shadow', '');
      el.appendChild(body);

      const head = document.createElement('a-sphere');
      head.setAttribute('radius', '0.25');
      head.setAttribute('color', p.color);
      head.setAttribute('position', '0 1.85 0');
      head.setAttribute('shadow', '');
      el.appendChild(head);

      const tag = document.createElement('a-entity');
      tag.setAttribute('position', '0 2.4 0');
      tag.setAttribute('text', `value:${p.name}; align:center; color:${p.color}; width:3`);
      tag.setAttribute('geometry', 'primitive:plane; width:2.2; height:0.4');
      tag.setAttribute('material', 'color:#000; opacity:0.6; transparent:true');
      el.appendChild(tag);

      const shadow = document.createElement('a-circle');
      shadow.setAttribute('radius', '0.5');
      shadow.setAttribute('color', '#000');
      shadow.setAttribute('opacity', '0.25');
      shadow.setAttribute('rotation', '-90 0 0');
      shadow.setAttribute('position', '0 -0.5 0');
      shadow.setAttribute('material', 'transparent:true');
      el.appendChild(shadow);

      document.getElementById('remoteLayer').appendChild(el);

      entry = { el, body, head, name: p.name, role: p.role, color: p.color, x:p.x, y:p.y, z:p.z, ry:p.ry, anim:p.anim };
      this.peers.set(p.userId, entry);
    } else {
      entry.name = p.name; entry.role = p.role; entry.color = p.color;
      entry.x = p.x; entry.y = p.y; entry.z = p.z; entry.ry = p.ry; entry.anim = p.anim;
    }
    // Smoothly interpolate on next frame
    entry.target = { x: p.x, y: p.y, z: p.z, ry: p.ry };
  }

  removePeer(userId) {
    const e = this.peers.get(userId);
    if (e?.el?.parentNode) e.el.parentNode.removeChild(e.el);
    this.peers.delete(userId);
    renderPeerList();
  }

  applySelfName() {
    if (!this.self) return;
    $('myNameTag').setAttribute('text', `value:${this.self.name}; align:center; color:${this.self.color}; width:3`);
    // Also recolor my body
    $('playerBody').setAttribute('color', this.self.color);
    $('playerHead').setAttribute('color', this.self.color);
  }

  sendMove(state) {
    const now = Date.now();
    if (now - this.lastSend < this.moveThrottle) return;
    this.lastSend = now;
    if (this.ws?.readyState === 1) {
      this.ws.send(JSON.stringify({ type: 'move', ...state }));
    }
  }

  sendChat(text) {
    if (this.ws?.readyState === 1) {
      this.ws.send(JSON.stringify({ type: 'chat', text }));
    }
  }

  // Per-frame: smooth-interpolate remote peer positions to their targets
  tick() {
    for (const e of this.peers.values()) {
      if (!e.target) continue;
      const lerp = 0.3;
      const cur = e.el.object3D.position;
      cur.x += (e.target.x - cur.x) * lerp;
      cur.y += (e.target.y - cur.y) * lerp;
      cur.z += (e.target.z - cur.z) * lerp;
      // Shortest-angle interpolation for ry
      let dy = e.target.ry - e.el.object3D.rotation.y;
      while (dy > Math.PI) dy -= Math.PI * 2;
      while (dy < -Math.PI) dy += Math.PI * 2;
      e.el.object3D.rotation.y += dy * lerp;
    }
  }
}

// =====================================================================
// HUD HELPERS
// =====================================================================
function setConn(ok) {
  const dot = $('connDot'); const txt = $('connText');
  if (ok) { dot.classList.add('on'); txt.textContent = 'CONECTADO'; txt.style.color = '#00ff88'; }
  else    { dot.classList.remove('on'); txt.textContent = 'DESCONECTADO'; txt.style.color = '#ff3838'; }
}

function renderPeerList() {
  const layer = $('peerList'); const items = $('peerItems'); const count = $('peerCount');
  if (!client) return;
  layer.style.display = 'block';
  const all = [];
  if (client.self) all.push({ userId: client.self.userId, name: client.self.name + ' (TÚ)', role: client.self.role, color: client.self.color, isYou: true });
  for (const [uid, p] of client.peers) all.push({ userId: uid, name: p.name, role: p.role, color: p.color, isYou: false });
  count.textContent = all.length;
  items.innerHTML = all.map(p =>
    `<div class="peer-item">
       <span class="peer-dot" style="background:${p.color};color:${p.color}"></span>
       <span class="peer-name ${p.isYou ? 'peer-you' : ''}">${escapeHtml(p.name)}</span>
       ${p.role && p.role !== 'member' ? `<span class="peer-role">[${p.role}]</span>` : ''}
     </div>`
  ).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addChat({ name, text, color, role, system }) {
  const box = $('chat-box'); box.style.display = 'block';
  $('chat-input-row').style.display = 'flex';
  const div = document.createElement('div');
  div.className = 'chat-msg';
  if (system) {
    div.innerHTML = `<span style="color:${color}">· ${escapeHtml(text)}</span>`;
  } else {
    div.innerHTML = `<span class="chat-name" style="color:${color}">${escapeHtml(name)}</span><span class="peer-role">${role !== 'member' ? ' [' + role + ']' : ''}</span>: <span class="chat-text">${escapeHtml(text)}</span>`;
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  // Trim to last 30
  while (box.children.length > 30) box.removeChild(box.firstChild);
}

// =====================================================================
// LOCAL PLAYER CONTROLS (re-used logic from your original code)
// =====================================================================
const player = () => document.querySelector('#player');
const cameraRig = () => document.querySelector('#cameraRig');
const keys = { w:false, s:false, a:false, d:false, shift:false };
let isMoving = false, isRunning = false, isJumping = false;
let jumpStart = 0;
const walkSpeed = 4.0, runSpeed = 8.0;
let currentSpeed = walkSpeed;

const JUMP_HEIGHT = 2.0, JUMP_DURATION = 0.7;

function performJump() {
  if (isJumping || !player()) return;
  isJumping = true; jumpStart = performance.now() / 1000;
  $('currentAnim').innerHTML = 'JUMP 🦘';
  setTimeout(() => { isJumping = false; $('currentAnim').innerHTML = isMoving ? (isRunning ? 'RUN 🏃' : 'WALK 🚶') : 'IDLE 💤'; }, JUMP_DURATION * 1000);
}

function updateMovement(delta) {
  const p = player(); if (!p) return;
  const rotSpeed = 2.5 * delta;
  if (keys.a) p.object3D.rotation.y += rotSpeed;
  if (keys.d) p.object3D.rotation.y -= rotSpeed;

  if (keys.w) {
    const speed = currentSpeed * delta;
    const ry = p.object3D.rotation.y;
    let nx = p.object3D.position.x + Math.sin(ry) * speed;
    let nz = p.object3D.position.z + Math.cos(ry) * speed;
    nx = Math.max(-180, Math.min(180, nx));
    nz = Math.max(-180, Math.min(180, nz));
    p.object3D.position.x = nx; p.object3D.position.z = nz;
  }
}

let camTargetX=0, camTargetY=0, camTargetZ=0;
function updateCamera() {
  const p = player(); const rig = cameraRig(); if (!p || !rig) return;
  const dist = 7.0, height = 2.5, smooth = 0.15;
  const pos = p.object3D.position, ry = p.object3D.rotation.y;
  const tx = pos.x - Math.sin(ry) * dist;
  const ty = pos.y + height;
  const tz = pos.z - Math.cos(ry) * dist;
  rig.object3D.position.x += (tx - rig.object3D.position.x) * smooth;
  rig.object3D.position.y += (ty - rig.object3D.position.y) * smooth;
  rig.object3D.position.z += (tz - rig.object3D.position.z) * smooth;

  const targetY = pos.y + 1.5;
  const dx = pos.x - rig.object3D.position.x, dy = targetY - rig.object3D.position.y, dz = pos.z - rig.object3D.position.z;
  rig.object3D.rotation.y = Math.atan2(-dx, -dz);
  rig.object3D.rotation.x = Math.atan2(dy, Math.sqrt(dx*dx + dz*dz));
}

function resetPos() {
  const p = player(); if (!p) return;
  p.object3D.position.set(0, 0.5, 0); p.object3D.rotation.set(0, 0, 0);
}

function setInputs() {
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup')   { keys.w = true; isMoving = true; }
    if (k === 's' || k === 'arrowdown') { keys.s = true; isMoving = true; }
    if (k === 'a' || k === 'arrowleft') { keys.a = true; }
    if (k === 'd' || k === 'arrowright'){ keys.d = true; }
    if (k === 'shift') { isRunning = true; currentSpeed = runSpeed; $('speedState').innerHTML = '🏃 SPRINT'; $('speedState').style.color = '#00d4ff'; }
    if (k === 'r') resetPos();
    if (k === ' ' || k === 'space') { performJump(); e.preventDefault(); }
    if (k === 't') { $('chat-input').focus(); }
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup')   keys.w = false;
    if (k === 's' || k === 'arrowdown') keys.s = false;
    if (k === 'a' || k === 'arrowleft') keys.a = false;
    if (k === 'd' || k === 'arrowright')keys.d = false;
    if (k === 'shift') { isRunning = false; currentSpeed = walkSpeed; $('speedState').innerHTML = 'normal'; $('speedState').style.color = '#888'; }
    isMoving = keys.w || keys.s || keys.a || keys.d;
  });

  // Chat
  const input = $('chat-input');
  input?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim()) {
      client?.sendChat(input.value.trim());
      input.value = '';
    }
  });
  $('chat-send').addEventListener('click', () => {
    if (input.value.trim()) { client.sendChat(input.value.trim()); input.value = ''; }
  });
}

// =====================================================================
// GAME LOOP
// =====================================================================
let lastT = 0;
function gameLoop(now) {
  const nowSec = now / 1000;
  let delta = Math.min(0.033, (now - lastT) / 1000) || 0.016;
  lastT = now;

  // Jump height
  if (isJumping && player()) {
    const t = (nowSec - jumpStart) / JUMP_DURATION;
    const h = Math.sin(Math.min(1, t) * Math.PI) * JUMP_HEIGHT;
    player().object3D.position.y = 0.5 + h;
  } else if (player()) {
    player().object3D.position.y = 0.5;
  }

  updateMovement(delta);
  updateCamera();
  client?.tick();

  // Send local position to server (throttled inside)
  if (player()) {
    const p = player().object3D;
    client?.sendMove({
      x: p.position.x, y: p.position.y, z: p.position.z, ry: p.rotation.y,
      anim: isJumping ? 'jump' : (isMoving ? (isRunning ? 'run' : 'walk') : 'idle'),
    });
  }

  // HUD
  if (player()) {
    $('posX').textContent = player().object3D.position.x.toFixed(1);
    $('posZ').textContent = player().object3D.position.z.toFixed(1);
    $('posY').textContent = player().object3D.position.y.toFixed(2);
  }

  requestAnimationFrame(gameLoop);
}

// =====================================================================
// BOOT
// =====================================================================
let client = null;
window.addEventListener('load', async () => {
  setInputs();
  requestAnimationFrame(gameLoop);

  const { token, user } = await ensureAuth();
  document.body.classList.add('ciudad-ready');

  // Hide the login panel cleanly
  var lb = document.getElementById('login-bg');
  if (lb) { lb.style.cssText = 'display:none!important;visibility:hidden!important;'; }

  // Show the authenticated user pill with the real name + role
  var pill = document.getElementById('user-pill');
  var pillName = document.getElementById('userPillName');
  var pillRole = document.getElementById('userPillRole');
  var pillAvatar = document.getElementById('userPillAvatar');
  if (pill && pillName) {
    pillName.textContent = (user && (user.name || user.email)) || 'Tú';
    if (pillRole) pillRole.textContent = (user && user.role) || 'guest';
    if (pillAvatar) {
      // Hash user email to a vibrant color so each user gets a unique avatar tint
      var seed = ((user && user.email) || 'anon').split('').reduce(function(a,c){a=((a<<5)-a)+c.charCodeAt(0);return a&a;},0);
      var hue = Math.abs(seed) % 360;
      pillAvatar.style.background = 'hsl(' + hue + ',80%,55%)';
      pillAvatar.style.color = 'hsl(' + hue + ',80%,55%)';
    }
    pill.classList.add('visible');
  }

  client = new CiudadClient(token);
  client.connect();

  // If WebSocket fails to open within 5s, the token is invalid — bounce back to login
  setTimeout(() => {
    if (!client || !client.ws || client.ws.readyState !== 1) {
      console.warn('[ciudad] WebSocket no se abrió — token probablemente inválido');
      setStatus('Conexión fallida — vuelve a iniciar sesión', '#ff3838');
    }
  }, 5000);

  // Logout button (in the user pill): clear session and reload to show the login form
  var lbBtn = document.getElementById('logoutBtnPill');
  if (lbBtn) lbBtn.onclick = function() {
    clearSession();
    location.reload();
  };
});
</script>
